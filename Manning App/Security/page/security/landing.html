<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../Style/output.css">
</head>

<body class="bg-slate-100 min-h-screen">

  <!-- HEADER -->
<header
  class="sticky top-0 z-20
         bg-white/90 backdrop-blur-xl
         border-b border-slate-200
         shadow-sm">

  <div class="px-4 py-4 flex items-center justify-between">
    
    <!-- LEFT -->
    <h1 class="text-base font-semibold text-slate-800">
      Attendance History
    </h1>

    <!-- RIGHT -->
    <div class="flex items-center gap-3">
      <span id="userName" class="text-sm text-slate-500"></span>

      <!-- HAMBURGER -->
      <button
        id="menuBtn"
        class="p-2 rounded-md hover:bg-slate-100 transition"
        aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2"
             class="w-5 h-5 text-slate-700">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <!-- DROPDOWN MENU -->
  <div
    id="menuDropdown"
    class="hidden absolute right-4 top-16
           bg-white rounded-xl shadow-xl
           border border-slate-200
           w-40 overflow-hidden">

    <button
      id="logoutBtn"
      class="w-full text-left px-4 py-3
             text-sm text-rose-600
             hover:bg-rose-50 transition">
      Logout
    </button>

  </div>
</header>


  <!-- CONTENT -->
  <main class="px-2 pt-4 pb-28">
    <div id="historyList" class="space-y-4"></div>
  </main>

  <!-- FAB -->
  <button
    id="addAttendanceBtn"
    aria-label="Add attendance"
    class="fixed bottom-6 right-4 z-30
          w-14 h-14 rounded-full
          bg-gradient-to-br from-blue-600 to-blue-700
          shadow-xl
          flex items-center justify-center
          active:scale-95
          hover:shadow-2xl
          transition">

    <!-- PLUS ICON -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="white"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-7 h-7">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>

  </button>

  <!-- DELETE CONFIRM MODAL -->
  <div
    id="deleteModal"
    class="fixed inset-0 z-50 hidden
          bg-black/40 backdrop-blur-sm
          flex items-center justify-center">

    <div class="bg-white rounded-2xl p-5 w-80 shadow-xl">

      <h3 class="text-base font-semibold text-slate-800 mb-3">
        Confirm Delete
      </h3>

      <p class="text-sm text-slate-600 mb-3">
        Enter password to delete this attendance record.
      </p>

      <input
        id="deletePassword"
        type="password"
        placeholder="Password"
        class="w-full px-3 py-2 rounded-lg
              border border-slate-300
              text-sm mb-4"
      />

      <div class="flex justify-end gap-2">
        <button
          id="cancelDelete"
          class="px-4 py-2 text-sm rounded-lg
                bg-slate-200 text-slate-700">
          Cancel
        </button>

        <button
          id="confirmDelete"
          class="px-4 py-2 text-sm rounded-lg
                bg-rose-600 text-white">
          Delete
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="landing.js"></script>
</body>
</html>
