<!DOCTYPE html>
<html>
<head>
  <title>Officer Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../style/officer-output.css">
</head>

<body class="min-h-screen bg-slate-100
             flex items-center justify-center
             px-4">

  <div class="
      bg-white/70 backdrop-blur-xl
      border border-white/30
      rounded-2xl shadow-xl

      w-full
      max-w-md            <!-- 🔥 increased width -->
      px-6 py-8           <!-- 🔥 more padding -->
      sm:px-8 sm:py-10
  ">

    <h2 class="text-lg font-semibold text-slate-800 text-center mb-6">
      Officer Login
    </h2>

    <input
      id="username"
      placeholder="Name"
      class="w-full mb-4 px-4 py-3 rounded-lg
             border border-slate-300
             text-base
             focus:outline-none
             focus:ring-2 focus:ring-blue-500"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      class="w-full mb-6 px-4 py-3 rounded-lg
             border border-slate-300
             text-base
             focus:outline-none
             focus:ring-2 focus:ring-blue-500"
    >

    <button
      id="loginBtn"
      class="w-full py-3 rounded-xl
             text-white text-base font-semibold
             bg-gradient-to-r from-blue-600 to-blue-700
             hover:from-blue-700 hover:to-blue-800
             active:scale-[0.98]
             transition">
      Login
    </button>

  </div>

  <script src="officer-login.js"></script>
</body>
</html>
